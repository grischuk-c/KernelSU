name: Build Manager

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/scripts/setup-rust-build.sh'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/scripts/setup-rust-build.sh'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_call:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KernelSU" \
            -storetype JKS \
            -keystore key.jks

          echo "keystore=$(base64 -w 0 key.jks)" >> $GITHUB_OUTPUT

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    uses: ./.github/workflows/ksud.yml
    with:
      target: aarch64-linux-android
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    needs: [generate-key]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write key
        env:
          KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$KEYSTORE" | base64 -d > key.jks
          {
            echo KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo KEY_ALIAS='key'
            echo KEY_PASSWORD="$KEY_PASSWORD"
            echo KEYSTORE_FILE='key.jks'
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew clean assembleRelease

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud

      - name: Repack and resign
        env:
          KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$KEYSTORE" | base64 -d > key.jks
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -K key.jks \
            -A key \
            -P "$KEYSTORE_PASSWORD" \
            -S "$KEY_PASSWORD" \
            --strip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager
          path: dist/*.apk
